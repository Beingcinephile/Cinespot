<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CINE SPOT - Movie Guide</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>🎬 CINE SPOT</h1>
        <button id="adminPanelBtn" class="admin-btn">🔧 Admin</button>
    </header>

    <!-- ===== COMPACT GLASSY LOGIN PANEL ===== -->
    <div id="userSection" class="user-section">
        <div id="loggedOutView">
            <h3>Welcome, <span id="welcomeUsername">Guest</span></h3>
            
            <div class="login-form">
                <label>Enter Username</label>
                <div class="input-group">
                    <input type="text" id="dummyUsername" placeholder="Enter Username" autocomplete="off">
                </div>
                
                <label>Enter Password</label>
                <div class="input-group">
                    <input type="password" id="dummyPassword" placeholder="Enter Password">
                </div>
                
                <button id="loginBtn">✨ Sign In</button>
            </div>
        </div>
        <div id="loggedInView" style="display:none">
            <h3>Welcome, <span id="currentUser"></span>!</h3>
            <div style="text-align:center; margin-top:10px;">
                <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
            </div>
        </div>
    </div>

    <!-- HOME SECTION -->
    <div id="homeSection">
        
        <!-- FEATURED MOVIES HORIZONTAL SLIDER -->
        <div class="featured-slider-section">
            <h3>⭐ Featured Movies</h3>
            <div class="slider-wrapper">
                <button class="slider-btn prev-featured-btn">❮</button>
                <div class="featured-slider" id="featuredSlider"></div>
                <button class="slider-btn next-featured-btn">❯</button>
            </div>
            <div class="slider-dots" id="featuredDots"></div>
        </div>

        <!-- All Movies Grid -->
        <div class="movies-section">
            <div class="movies-header">
                <h2>🎥 All Movies</h2>
            </div>
            <div id="movieGrid" class="movie-grid"></div>
        </div>
    </div>

    <!-- SEARCH SECTION (hidden by default) -->
    <div id="searchSection" style="display:none">
        <div class="search-section">
            <div class="search-box-full">
                <input type="text" id="searchInputFull" placeholder="🔍 Search by title, genre, director, year...">
            </div>
            <div id="searchResults" class="movie-grid"></div>
        </div>
    </div>

    <!-- CATEGORIES SECTION (hidden by default) -->
    <div id="categoriesSection" style="display:none">
        <div class="category-section">
            <div class="category-header">
                <h3>🎭 Select Category</h3>
            </div>
            <div id="categoriesList" class="categories-list"></div>
            <div id="categoryMovies" class="movie-grid" style="margin-top: 20px;">
                <p style="text-align:center; grid-column:1/-1">Select a category to see movies</p>
            </div>
        </div>
    </div>

    <!-- MY ACCOUNT SECTION (hidden by default) -->
    <div id="accountSection" style="display:none">
        <div class="favorites-section">
            <h3>⭐ My Favorites</h3>
            <div id="favoritesGrid" class="favorites-grid"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>MADE BY CINEPHILES FOR CINEPHILES</p>
    </div>

    <!-- Floating Request Button -->
    <button class="floating-request-btn" onclick="openRequestPanel('')" title="Request Movie/Series">
        📩
        <span class="tooltip">Request Movie</span>
    </button>

    <!-- BOTTOM NAVIGATION BAR -->
    <div class="bottom-nav">
        <div class="nav-item active" data-page="home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </div>
        <div class="nav-item" data-page="search">
            <span class="nav-icon">🔍</span>
            <span class="nav-label">Search</span>
        </div>
        <div class="nav-item" data-page="categories">
            <span class="nav-icon">🎭</span>
            <span class="nav-label">Categories</span>
        </div>
        <div class="nav-item" data-page="account">
            <span class="nav-icon">⭐</span>
            <span class="nav-label">My Account</span>
        </div>
    </div>

    <!-- ===== PREMIUM LOADING SPINNER ===== -->
    <div id="loadingIndicator" class="loading-overlay">
        <div class="loading-container">
            <div class="loading-spinner-premium">
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
                <div class="spinner-center">🎬</div>
            </div>
            <div class="loading-text-premium">Loading Movies</div>
            <div class="loading-dots">
                <span class="dot-pulse"></span>
                <span class="dot-pulse"></span>
                <span class="dot-pulse"></span>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
